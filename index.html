<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уютная Пиксельная Ферма</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .header {
            font-size: 24px;
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 2px 2px #000;
        }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 0 auto 30px auto;
        }
        .plot {
            background-color: #8e6f4b;
            border: 4px solid #5c3a21;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .plot:active {
            transform: scale(0.95);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: 3px solid #1e8449;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #7f8c8d;
            border-color: #2c3e50;
            cursor: not-allowed;
        }
        .shop {
            font-size: 18px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="header">💰 Монеты: <span id="coins">20</span></div>
    
    <div class="farm-grid" id="grid">
        <!-- 9 грядок -->
        <div class="plot" data-id="0"></div>
        <div class="plot" data-id="1"></div>
        <div class="plot" data-id="2"></div>
        <div class="plot" data-id="3"></div>
        <div class="plot" data-id="4"></div>
        <div class="plot" data-id="5"></div>
        <div class="plot" data-id="6"></div>
        <div class="plot" data-id="7"></div>
        <div class="plot" data-id="8"></div>
    </div>

    <div class="shop">
        <p>Выбери, что посадить (нажми кнопку, потом грядку):</p>
        <div class="controls">
            <button id="btn-carrot" onclick="selectSeed('carrot')">🥕 Морковь (2 монеты)</button>
            <button id="btn-potato" onclick="selectSeed('potato')">🥔 Картофель (4 монеты)</button>
        </div>
    </div>

    <script>
        let coins = 20;
        let selectedSeed = 'carrot'; // По умолчанию морковь
        const plots = Array(9).fill(null); // Состояние грядок

        const seedData = {
            'carrot': { cost: 2, sell: 5, growTime: 3000, icon: '🥕', name: 'Морковь' },
            'potato': { cost: 4, sell: 8, growTime: 5000, icon: '🥔', name: 'Картофель' }
        };

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            
            // Обновляем кнопки
            document.getElementById('btn-carrot').disabled = coins < seedData['carrot'].cost;
            document.getElementById('btn-potato').disabled = coins < seedData['potato'].cost;

            // Обновляем грядки
            const plotDivs = document.querySelectorAll('.plot');
            plotDivs.forEach((div, index) => {
                const state = plots[index];
                if (!state) {
                    div.innerText = '';
                    div.style.backgroundColor = '#8e6f4b';
                } else if (state.stage === 'growing') {
                    div.innerText = '🌱';
                    div.style.backgroundColor = '#a67c52';
                } else if (state.stage === 'ready') {
                    div.innerText = state.data.icon;
                    div.style.backgroundColor = '#d4b895';
                }
            });
        }

        function selectSeed(type) {
            selectedSeed = type;
        }

        function plant(index) {
            const plot = plots[index];
            if (plot) return; // Если грядка занята, ничего не делаем

            const data = seedData[selectedSeed];
            if (coins < data.cost) {
                alert("Недостаточно монет!");
                return;
            }

            // Тратим монеты и сажаем
            coins -= data.cost;
            plots[index] = { stage: 'growing', data: data };
            updateUI();

            // Таймер роста
            setTimeout(() => {
                if (plots[index] && plots[index].stage === 'growing') {
                    plots[index].stage = 'ready';
                    updateUI();
                }
            }, data.growTime);
        }

        function harvest(index) {
            const plot = plots[index];
            if (!plot || plot.stage !== 'ready') return;

            // Собираем урожай
            coins += plot.data.sell;
            plots[index] = null;
            updateUI();
        }

        // Добавляем обработчики кликов на грядки
        document.querySelectorAll('.plot').forEach(div => {
            div.addEventListener('click', (e) => {
                const index = parseInt(e.target.getAttribute('data-id'));
                const plot = plots[index];
                
                if (!plot) {
                    plant(index);
                } else if (plot.stage === 'ready') {
                    harvest(index);
                }
            });
        });

        // Первый запуск
        updateUI();
    </script>
</body>
</html>
