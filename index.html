<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уютная Пиксельная Ферма</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .header {
            font-size: 24px;
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 2px 2px #000;
        }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 0 auto 30px auto;
        }
        .plot {
            background-color: #8e6f4b;
            border: 4px solid #5c3a21;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .plot:active {
            transform: scale(0.95);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 10px 15px;
            background-color: #27ae60;
            color: white;
            border: 3px solid #1e8449;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #7f8c8d;
            border-color: #2c3e50;
            cursor: not-allowed;
        }
        .shop {
            font-size: 18px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="header">💰 Монеты: <span id="coins">20</span></div>
    
    <div class="farm-grid" id="grid">
        <div class="plot" data-id="0"></div>
        <div class="plot" data-id="1"></div>
        <div class="plot" data-id="2"></div>
        <div class="plot" data-id="3"></div>
        <div class="plot" data-id="4"></div>
        <div class="plot" data-id="5"></div>
        <div class="plot" data-id="6"></div>
        <div class="plot" data-id="7"></div>
        <div class="plot" data-id="8"></div>
    </div>

    <div class="shop">
        <p>Выбери, что посадить:</p>
        <div class="controls">
            <button id="btn-carrot" onclick="selectSeed('carrot')">🥕 Морковь (2)</button>
            <button id="btn-potato" onclick="selectSeed('potato')">🥔 Картофель (4)</button>
        </div>
    </div>

    <script>
        // Загружаем сохранение или начинаем с нуля
        let savedData = localStorage.getItem('farmSave');
        let state = savedData ? JSON.parse(savedData) : { coins: 20, plots: Array(9).fill(null) };
        
        let coins = state.coins;
        let plots = state.plots;
        let selectedSeed = 'carrot';

        const seedData = {
            'carrot': { cost: 2, sell: 5, growTime: 3000, icon: '🥕' },
            'potato': { cost: 4, sell: 8, growTime: 5000, icon: '🥔' }
        };

        // Функция сохранения
        function saveGame() {
            localStorage.setItem('farmSave', JSON.stringify({ coins: coins, plots: plots }));
        }

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            
            document.getElementById('btn-carrot').disabled = coins < seedData['carrot'].cost;
            document.getElementById('btn-potato').disabled = coins < seedData['potato'].cost;

            const plotDivs = document.querySelectorAll('.plot');
            plotDivs.forEach((div, index) => {
                const p = plots[index];
                if (!p) {
                    div.innerText = '';
                    div.style.backgroundColor = '#8e6f4b';
                } else if (p.stage === 'growing') {
                    div.innerText = '🌱';
                    div.style.backgroundColor = '#a67c52';
                } else if (p.stage === 'ready') {
                    div.innerText = p.data.icon;
                    div.style.backgroundColor = '#d4b895';
                }
            });
            saveGame(); // Сохраняем при каждом обновлении интерфейса
        }

        function selectSeed(type) {
            selectedSeed = type;
        }

        function plant(index) {
            if (plots[index]) return;
            const data = seedData[selectedSeed];
            if (coins < data.cost) return;

            coins -= data.cost;
            plots[index] = { stage: 'growing', data: data };
            updateUI();

            // Запускаем таймер роста
            setTimeout(() => {
                if (plots[index] && plots[index].stage === 'growing') {
                    plots[index].stage = 'ready';
                    updateUI();
                }
            }, data.growTime);
        }

        function harvest(index) {
            const p = plots[index];
            if (!p || p.stage !== 'ready') return;
            coins += p.data.sell;
            plots[index] = null;
            updateUI();
        }

        // Обработка кликов
        document.querySelectorAll('.plot').forEach(div => {
            div.addEventListener('click', (e) => {
                const index = parseInt(e.target.getAttribute('data-id'));
                if (!plots[index]) plant(index);
                else if (plots[index].stage === 'ready') harvest(index);
            });
        });

        // Восстанавливаем таймеры для тех растений, которые были посажены до перезагрузки
        plots.forEach((p, i) => {
            if (p && p.stage === 'growing') {
                setTimeout(() => {
                    if (plots[i] && plots[i].stage === 'growing') {
                        plots[i].stage = 'ready';
                        updateUI();
                    }
                }, p.data.growTime);
            }
        });

        updateUI();
    </script>
</body>
</html>
