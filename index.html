<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уютная Пиксельная Ферма</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        .header {
            font-size: 22px;
            margin-bottom: 15px;
            color: #f1c40f;
            text-shadow: 2px 2px #000;
        }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 10px;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        .plot {
            background-color: #8e6f4b;
            border: 4px solid #5c3a21;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .plot:active {
            transform: scale(0.95);
        }
        .plot.locked {
            background-color: #34495e;
            border-color: #2c3e50;
            font-size: 30px;
        }
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: 3px solid #1e8449;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1 1 40%;
        }
        button:disabled {
            background-color: #7f8c8d;
            border-color: #2c3e50;
            cursor: not-allowed;
        }
        .btn-sell {
            background-color: #d35400;
            border-color: #a04000;
            flex: 1 1 100%;
        }
        .shop-title {
            font-size: 16px;
            color: #bdc3c7;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">💰 Монеты: <span id="coins">20</span></div>
    
    <div class="farm-grid" id="grid">
        <!-- Грядки будут генерироваться через JS -->
    </div>

    <div class="controls">
        <button id="btn-carrot" onclick="selectSeed('carrot')">🥕 Морковь (2)</button>
        <button id="btn-potato" onclick="selectSeed('potato')">🥔 Картофель (4)</button>
        <button class="btn-sell" onclick="sellAll()">🚜 Собрать весь урожай</button>
    </div>

    <div class="shop-title">Расширение фермы:</div>
    <div class="controls">
        <button id="btn-buy-plot" onclick="buyPlot()">🔒 Купить грядку (10)</button>
    </div>

    <script>
        // Начальное состояние (3 открытые, 6 закрытых)
        let savedData = localStorage.getItem('farmSave');
        let state = savedData ? JSON.parse(savedData) : { 
            coins: 20, 
            plots: [null, null, null, 'locked', 'locked', 'locked', 'locked', 'locked', 'locked'] 
        };
        
        let coins = state.coins;
        let plots = state.plots;
        let selectedSeed = 'carrot';

        const seedData = {
            'carrot': { cost: 2, sell: 5, growTime: 3000, icon: '🥕' },
            'potato': { cost: 4, sell: 8, growTime: 5000, icon: '🥔' }
        };

        function saveGame() {
            localStorage.setItem('farmSave', JSON.stringify({ coins: coins, plots: plots }));
        }

        function generateGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            plots.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'plot';
                div.setAttribute('data-id', index);
                if (p === 'locked') div.classList.add('locked');
                div.addEventListener('click', () => handlePlotClick(index));
                grid.appendChild(div);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            
            document.getElementById('btn-carrot').disabled = coins < seedData['carrot'].cost;
            document.getElementById('btn-potato').disabled = coins < seedData['potato'].cost;
            document.getElementById('btn-buy-plot').disabled = coins < 10 || !plots.includes('locked');

            const plotDivs = document.querySelectorAll('.plot');
            plotDivs.forEach((div, index) => {
                const p = plots[index];
                div.innerText = '';
                div.className = 'plot';
                
                if (p === 'locked') {
                    div.classList.add('locked');
                    div.innerText = '🔒';
                } else if (!p) {
                    div.style.backgroundColor = '#8e6f4b';
                } else if (p.stage === 'growing') {
                    div.innerText = '🌱';
                    div.style.backgroundColor = '#a67c52';
                } else if (p.stage === 'ready') {
                    div.innerText = p.data.icon;
                    div.style.backgroundColor = '#d4b895';
                }
            });
            saveGame();
        }

        function selectSeed(type) {
            selectedSeed = type;
        }

        function handlePlotClick(index) {
            const p = plots[index];
            
            if (p === 'locked') {
                alert('Эта грядка еще не куплена!');
                return;
            }
            if (!p) {
                plant(index);
            } else if (p.stage === 'ready') {
                harvest(index);
            }
        }

        function plant(index) {
            const data = seedData[selectedSeed];
            if (coins < data.cost) return;

            coins -= data.cost;
            plots[index] = { stage: 'growing', data: data };
            updateUI();

            setTimeout(() => {
                if (plots[index] && plots[index].stage === 'growing') {
                    plots[index].stage = 'ready';
                    updateUI();
                }
            }, data.growTime);
        }

        function harvest(index) {
            const p = plots[index];
            if (!p || p.stage !== 'ready') return;
            coins += p.data.sell;
            plots[index] = null;
            updateUI();
        }

        function sellAll() {
            let earned = 0;
            plots.forEach((p, i) => {
                if (p && p.stage === 'ready') {
                    earned += p.data.sell;
                    plots[i] = null;
                }
            });
            if (earned > 0) {
                coins += earned;
                updateUI();
            }
        }

        function buyPlot() {
            if (coins < 10) return;
            const lockIndex = plots.indexOf('locked');
            if (lockIndex !== -1) {
                coins -= 10;
                plots[lockIndex] = null;
                generateGrid(); // Перерисовываем сетку
            }
        }

        // Восстановление таймеров
        function restoreTimers() {
            plots.forEach((p, i) => {
                if (p && p.stage === 'growing') {
                    setTimeout(() => {
                        if (plots[i] && plots[i].stage === 'growing') {
                            plots[i].stage = 'ready';
                            updateUI();
                        }
                    }, p.data.growTime);
                }
            });
        }

        generateGrid();
        restoreTimers();
    </script>
</body>
</html>
